<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris — tweakable icons &amp; fonts</title>
<meta name="description" content="Open icon + alphabet base set. Restyle every icon (badges, flat shadows) and build your own free font (sans, serif, script-style) in all 9 weights, then export fonts, SVG, PNG and a FontAwesome-style reference kit.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" width="26" height="26"><circle cx="16" cy="16" r="14" fill="#4f46e5"/><circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-width="3"/></svg> Iris</div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="icons" class="on">Icons</button>
    <button role="tab" data-tab="type">Typeface</button>
  </nav>
  <span id="search-wrap" class="sw"><select id="cat" aria-label="Category"></select><input id="search" type="search" placeholder="Search icons…" aria-label="Search"></span>
  <a class="gh" href="https://github.com/asticore/iris" target="_blank" rel="noopener">GitHub</a>
</header>
<div class="layout">
  <aside class="controls" id="controls"></aside>
  <main>
    <section id="view-icons">
      <div class="hint">Tweaks apply to <b>every</b> icon. Click one to export it, or export the whole set. <span id="icon-count"></span></div>
      <div id="icon-grid" class="grid"></div>
    </section>
    <section id="view-type" hidden>
      <textarea id="type-text" rows="2" spellcheck="false" aria-label="Preview text">Iris Hamburgefonts
0123456789</textarea>
      <div id="type-preview" class="preview"></div>
      <div id="glyph-grid" class="grid small"></div>
    </section>
  </main>
  <aside class="inspector" id="inspector"></aside>
</div>
<script src="vendor/opentype.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="data/glyphs-upper.js"></script>
<script src="data/glyphs-lower.js"></script>
<script src="data/glyphs-misc.js"></script>
<!--ICONS-->
<script src="data/icons-animals.js"></script>
<script src="data/icons-buildings.js"></script>
<script src="data/icons-business.js"></script>
<script src="data/icons-comms.js"></script>
<script src="data/icons-devices.js"></script>
<script src="data/icons-general.js"></script>
<script src="data/icons-holidays.js"></script>
<script src="data/icons-home.js"></script>
<script src="data/icons-media.js"></script>
<script src="data/icons-nature.js"></script>
<script src="data/icons-people.js"></script>
<script src="data/icons-shapes.js"></script>
<script src="data/icons-ui.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
